name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Python syntax check
        run: python -m py_compile app/runtime.py main.py

      - name: Frontend typecheck and production build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        run: python -m pytest -q

      - name: Agent evaluation (offline, no LLM key needed)
        run: python scripts/evaluate_rag.py --force-lexical

      - name: Browser acceptance test
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t complaint-copilot:ci .

      - name: Start Docker smoke container
        run: |
          docker run --detach --name complaint-copilot-ci --publish 8000:8000 \
            --env AUTH_ENFORCED=false \
            --env REDIS_ENABLED=false \
            --env DATA_QUERY_BACKEND=sqlite \
            complaint-copilot:ci

      - name: Smoke API and frontend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs complaint-copilot-ci
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /tmp/complaint-index.html
          grep --fixed-strings '<div id="app"></div>' /tmp/complaint-index.html

      - name: Stop Docker smoke container
        if: always()
        run: docker rm --force complaint-copilot-ci || true
